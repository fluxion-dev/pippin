[project]
name = "pippin"
version = "0.1.0"
description = "High resolution ascii/utf8 image renderer for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "Pillow>=10.0.0",
  "cairosvg>=2.7.0",
]

[project.scripts]
pippin = "pippin.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
