name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system libs for cairosvg
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libgdk-pixbuf2.0-0
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Assert dist exists
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No dist artifacts found" >&2
            exit 1
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: pippin-dist
          path: dist/*

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system libs for cairosvg
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libgdk-pixbuf2.0-0
      - uses: actions/download-artifact@v4
        with:
          name: pippin-dist
          path: ./dist
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./dist/*.whl
      - run: pippin --help
      - run: pippin --version
      - name: Smoke render (png + svg)
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (64, 32), (20, 120, 200))
          d = ImageDraw.Draw(img)
          d.ellipse([16, 4, 48, 28], fill=(255, 200, 40))
          img.save("/tmp/smoke.png")
          open("/tmp/smoke.svg", "w").write('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32"><rect width="64" height="32" fill="teal"/><circle cx="32" cy="16" r="10" fill="white"/></svg>')
          PY
          pippin /tmp/smoke.png --width 32 --charset ascii --no-color
          pippin /tmp/smoke.svg --width 32 --charset utf8 --no-color

  release:
    needs: [build, smoke-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pippin-dist
          path: ./dist
      - name: Assert release asset count
        run: |
          shopt -s nullglob
          files=(./dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Expected dist assets, found none" >&2
            exit 1
          fi
          ls -la ./dist
      - name: Create GitHub Release (prerelease iff preview)
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            PRE="--prerelease"
          else
            PRE=""
          fi
          gh release create "${{ github.ref_name }}" $PRE ./dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    needs: [build, smoke-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/pippin
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pippin-dist
          path: ./dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
